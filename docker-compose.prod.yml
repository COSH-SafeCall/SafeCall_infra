services:
  safecall-server:
    image: ghcr.io/OWNER/safecall-server:latest
    container_name: safecall-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+UseG1GC"
    expose:
      - "8081"
    volumes:
      - ./keys:/app/.keys
    networks:
      - safecall-network

  nginx:
    image: nginx:stable-alpine
    container_name: safecall-nginx
    restart: unless-stopped
    depends_on:
      - safecall-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - safecall-network

  certbot:
    image: certbot/certbot
    container_name: safecall-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

networks:
  safecall-network:
    driver: bridge
